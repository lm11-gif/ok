<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><strong id="modalTitle">Create agent</strong><button class="close" id="modalClose" aria-label="Close">×</button></div><div class="modal-body" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $ = (s,root=document)=>root.querySelector(s);
const $$ = (s,root=document)=>Array.from(root.querySelectorAll(s));
const uid = ()=>Math.random().toString(36).slice(2,9);
const escapeHTML = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowTime = ()=>new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const defaultAgents = [
 {id:'sage',name:'Sage',icon:'✦',type:'Reasoning partner',tone:'Calm, clear, rigorous',description:'Thinks carefully, tracks assumptions, and explains the why behind an answer.',instructions:'You are Sage, a careful reasoning partner. Think through problems methodically, state assumptions, distinguish facts from guesses, and give clear explanations. Do not pretend to have used tools or verified something you have not.',color:'#8dd6c1'},
 {id:'spark',name:'Spark',icon:'⚡',type:'Creative explorer',tone:'Inventive, energetic, curious',description:'Generates unusual directions, prototypes concepts, and pushes past obvious ideas.',instructions:'You are Spark, an inventive creative collaborator. Explore surprising ideas, combine concepts, and make proposals concrete. Be playful but useful. Offer a few genuinely distinct directions rather than repetitive variations.',color:'#f6bd7a'},
 {id:'patch',name:'Patch',icon:'⌘',type:'Code engineer',tone:'Direct, technical, honest',description:'Builds practical software, checks edge cases, and calls out what still needs testing.',instructions:'You are Patch, a senior software engineer. Write maintainable code, explain important trade-offs, check edge cases, and be explicit about what you have and have not tested. Never claim to run code unless a tool actually ran it.',color:'#86a9ff'},
 {id:'muse',name:'Muse',icon:'◌',type:'Character & story',tone:'Expressive, immersive, attentive',description:'Builds distinct voices, preserves details, and keeps fictional scenes coherent.',instructions:'You are Muse, a character and story collaborator. Maintain continuity, remember details in the current conversation, give characters distinct voices, and avoid flattening every character into the same tone. Follow the creative direction provided by the user.',color:'#c2a7ff'}
];
const defaultPrompts = [
 {id:'clear',name:'Clear thinking',tag:'Reasoning',text:'You are a precise thinking partner. First identify the actual question. Separate known facts, assumptions, and uncertainties. Work through the important steps, then give a concise conclusion. Do not invent evidence.'},
 {id:'critic',name:'Constructive critic',tag:'Evaluation',text:'Act as a constructive but demanding reviewer. Identify what works, what is weak, and what is missing. Prioritize the three most important improvements. Explain why each matters and give specific fixes.'},
 {id:'world',name:'World builder',tag:'Creative',text:'Help design a coherent fictional world. Prioritize internal consistency, cause and effect, culture, geography, ecology, and everyday details. Make the world feel lived-in rather than like a list of tropes.'},
 {id:'coder',name:'Build & verify',tag:'Coding',text:'Act as a practical software engineer. Clarify requirements only when necessary. Produce complete, usable code with sensible structure and error handling. Include a test plan and be honest about anything you could not execute or verify.'}
];
const freshState = ()=>({settings:{provider:'demo',baseUrl:'http://localhost:11434',apiKey:'',model:'',temperature:.7,systemNotice:true},agents:defaultAgents,memories:[],prompts:defaultPrompts,sessions:[],activeSession:null,activeAgent:'sage',experiments:[],stats:{messages:0,arenaRuns:0,promptRuns:0}});
let state = loadState();
function loadState(){try{const raw=localStorage.getItem('orbit_playground_v1');if(!raw)return freshState();const x=JSON.parse(raw);return {...freshState(),...x,settings:{...freshState().settings,...x.settings},stats:{...freshState().stats,...x.stats}}}catch{return freshState()}}
function save(){try{localStorage.setItem('orbit_playground_v1',JSON.stringify(state));}catch(e){toast('Could not save locally. Browser storage may be full.')}}
let currentPage='home', busy=false, activePrompt='clear';
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function pageTitle(p){return ({home:'Overview',chat:'Chat lab',arena:'Model arena',agents:'Agent forge',studio:'Prompt studio',experiments:'Experiments',tools:'Tool bench',memory:'Memory vault',settings:'Settings'})[p]||'Overview'}
function go(page){currentPage=page;$('#crumb').textContent=pageTitle(page);$$('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#sidebar').classList.remove('open');render();window.scrollTo({top:0,behavior:'smooth'})}
$('#mainNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
$$('.sidebar [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
$('#menuBtn').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#topSettings').addEventListener('click',()=>go('settings'));
function updateConnection(){const s=state.settings;const demo=s.provider==='demo';$('#connectionDot').classList.toggle('ok',!demo);$('#topDot').classList.toggle('ok',!demo);$('#connectionLabel').textContent=demo?'Demo environment':(s.provider==='ollama'?'Ollama endpoint':'Custom endpoint');$('#connectionDetail').textContent=demo?'Connect a model to bring your agents to life.':`${s.baseUrl||'Endpoint not set'} · ${s.model||'Choose a model'}`;$('#topModel').textContent=demo?'Demo model':(s.model||'No model selected');$('#agentCount').textContent=String(state.agents.length).padStart(2,'0');$('#memoryCount').textContent=String(state.memories.length).padStart(2,'0')}
function render(){updateConnection();const root=$('#pageContent');root.innerHTML=({home:homePage,chat:chatPage,arena:arenaPage,agents:agentsPage,studio:studioPage,experiments:experimentsPage,tools:toolsPage,memory:memoryPage,settings:settingsPage})[currentPage]();bindPage()}
function head(eyebrow,title,sub,actions=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div><div class="actions">${actions}</div></div>`}
function homePage(){const active=state.sessions.length;return `${head('Your creative workspace','A place to play with intelligence.','Build agents, test ideas, compare models, and make experiments you can actually revisit.',`<button class="btn primary" data-go="chat">＋ Start a conversation</button>`)}
<div class="banner"><div><div class="eyebrow" style="color:#9cefe1">WELCOME TO YOUR FIELD LAB</div><h2>Curiosity is the only entry requirement.</h2><p>Give an agent a personality. Put two models head-to-head. Break a prompt, rebuild it, and see what changes. This is your space to experiment.</p><div style="margin-top:15px"><button class="btn primary" data-go="agents">Create an agent <span>↗</span></button></div></div><div class="banner-art"><div class="orbit"></div><div class="orbit two"></div><div class="core"></div></div></div>
<div class="grid stats"><div class="stat"><div class="stat-label">Agents in your forge</div><div class="stat-value">${state.agents.length}</div><div class="stat-note">Personalities ready to launch</div></div><div class="stat"><div class="stat-label">Saved conversations</div><div class="stat-value">${active}</div><div class="stat-note">${state.stats.messages} messages sent</div></div><div class="stat"><div class="stat-label">Arena matchups</div><div class="stat-value">${state.stats.arenaRuns}</div><div class="stat-note">Side-by-side experiments</div></div><div class="stat"><div class="stat-label">Memory fragments</div><div class="stat-value">${state.memories.length}</div><div class="stat-note">Notes you can bring into chats</div></div></div>
<div class="grid two-col"><section class="panel"><div class="panel-head"><div><div class="panel-title">Choose your next experiment</div><div class="panel-sub">A few doors into the playground.</div></div><span class="tag">WORKSPACE</span></div><div class="panel-body"><div class="quick-grid"><button class="quick-card" data-go="chat"><div class="quick-icon">◉</div><div class="quick-title">Talk to an agent</div><div class="quick-desc">Give an AI a role and see where the conversation goes.</div></button><button class="quick-card" data-go="arena"><div class="quick-icon">⚔</div><div class="quick-title">Start a model battle</div><div class="quick-desc">Send one prompt to two models. Compare the answers.</div></button><button class="quick-card" data-go="studio"><div class="quick-icon">✳</div><div class="quick-title">Tinker with prompts</div><div class="quick-desc">Shape instructions and test the effect they have.</div></button><button class="quick-card" data-go="tools"><div class="quick-icon">⌘</div><div class="quick-title">Open the tool bench</div><div class="quick-desc">Inspect JSON, estimate tokens, and work with text.</div></button></div></div></section>
<section class="panel"><div class="panel-head"><div><div class="panel-title">Recent activity</div><div class="panel-sub">Your latest work, stored in this browser.</div></div><button class="btn small ghost" data-go="experiments">View all</button></div><div class="panel-body"><div class="activity-list">${recentActivities()}</div></div></section></div>
<div class="section-kicker">A QUICK NOTE</div><div class="notice info">Orbit is a local-first playground interface. Demo mode is simulated; connect Ollama or an OpenAI-compatible endpoint in Settings to send real requests to a model. Your agents, prompts, memories, and chat history stay in this browser.</div>`}
function recentActivities(){const items=[];state.sessions.slice().reverse().slice(0,3).forEach(s=>items.push({icon:'◉',name:s.title||'Conversation',meta:`Chat lab · ${s.messages.length} messages`,time:s.updated||'Recently'}));state.experiments.slice().reverse().slice(0,2).forEach(x=>items.push({icon:'⌁',name:x.title,meta:'Experiment · '+x.kind,time:x.time}));if(!items.length)return `<div class="empty"><div class="empty-icon">✧</div><strong>Your activity starts here</strong>Run a chat or experiment and it will show up here.</div>`;return items.slice(0,4).map(x=>`<div class="activity"><div class="activity-icon">${x.icon}</div><div><div class="activity-name">${escapeHTML(x.name)}</div><div class="activity-meta">${escapeHTML(x.meta)}</div></div><div class="activity-time">${escapeHTML(x.time)}</div></div>`).join('')}
function ensureSession(){let s=state.sessions.find(x=>x.id===state.activeSession);if(!s){s={id:uid(),title:'Untitled conversation',agentId:state.activeAgent,messages:[],updated:'Just now'};state.sessions.push(s);state.activeSession=s.id;save()}return s}
function chatPage(){const s=ensureSession();const agent=state.agents.find(a=>a.id===s.agentId)||state.agents[0];const messages=s.messages.map(m=>messageHTML(m)).join('');const select=state.agents.map(a=>`<option value="${a.id}" ${a.id===agent.id?'selected':''}>${escapeHTML(a.icon+' '+a.name)}</option>`).join('');return `${head('Conversation space','Chat lab','A focused place to talk, think, and explore with the agents you build.',`<button class="btn" id="newChat">＋ New chat</button>`)}
<div class="chat-layout"><section class="panel chat-panel"><div class="panel-head"><div class="chat-toolbar"><select class="select-small" id="chatAgent">${select}</select><span class="tag">${state.settings.provider==='demo'?'DEMO':'LIVE ENDPOINT'}</span></div><button class="btn small ghost" id="clearChat">Clear</button></div><div class="chat-window" id="chatWindow">${messages||`<div class="empty" style="margin:auto"><div class="empty-icon">${agent.icon}</div><strong>Start something interesting.</strong>Ask a question, test a character, or give ${escapeHTML(agent.name)} a challenge.</div>`}</div><div class="chat-composer"><div class="composer-inner"><textarea id="chatInput" rows="1" placeholder="Message ${escapeHTML(agent.name)}… (Enter to send, Shift + Enter for a new line)"></textarea><button class="send-btn" id="sendChat" title="Send message">↑</button></div><div class="composer-foot"><span>Agent: ${escapeHTML(agent.name)} · ${escapeHTML(agent.type)}</span><span>Enter ↵ to send</span></div></div></section>
<aside class="side-panel"><div class="side-box"><div class="side-box-title">CURRENT AGENT</div><div class="agent-mini"><div class="agent-avatar">${agent.icon}</div><div><div class="agent-mini-name">${escapeHTML(agent.name)}</div><div class="agent-mini-role">${escapeHTML(agent.type)}</div></div></div><div class="divider"></div><div class="context-item">${escapeHTML(agent.tone)}</div><div class="context-item">${escapeHTML(agent.description)}</div><button class="btn small" style="width:100%;justify-content:center;margin-top:8px" id="editCurrentAgent">Edit agent ↗</button></div>
<div class="side-box"><div class="side-box-title">CONTEXT ATTACHED</div><div class="context-item">Agent instructions</div><div class="context-item">${state.memories.length} saved memory notes</div><div class="context-item">Conversation history</div><div class="muted" style="font-size:9px;margin-top:8px">Memory notes are added to the model context when you send a message.</div></div>
<div class="side-box"><div class="side-box-title">SESSION</div><div class="context-item">${s.messages.length} messages</div><div class="context-item">Started ${escapeHTML(s.created||'just now')}</div><button class="btn small ghost" style="width:100%;justify-content:center;margin-top:6px" id="renameSession">Rename conversation</button></div></aside></div>`}
function messageHTML(m){return `<div class="message ${m.role==='user'?'user':'assistant'}"><div class="avatar">${m.role==='user'?'You':(m.icon||'✦')}</div><div><div class="msg-meta">${m.role==='user'?'YOU':escapeHTML(m.name||'AGENT')} · ${escapeHTML(m.time||'')}</div><div class="bubble">${escapeHTML(m.content||'')}</div></div></div>`}
function agentsPage(){return `${head('Personality workshop','Agent forge','Create distinct AI characters and specialists. Each agent carries its own instructions into the chat lab.',`<button class="btn primary" id="createAgent">＋ Forge an agent</button>`)}<div class="agent-grid">${state.agents.map(a=>`<article class="agent-card"><div class="agent-card-top"><div class="agent-card-icon" style="color:${a.color||'var(--aqua)'}">${escapeHTML(a.icon)}</div><div><div class="agent-card-name">${escapeHTML(a.name)}</div><div class="agent-card-type">${escapeHTML(a.type)}</div></div></div><div class="agent-desc">${escapeHTML(a.description)}</div><div class="agent-card-bottom"><span class="tag">${escapeHTML(a.tone)}</span><div class="agent-actions"><button class="mini-btn" data-edit-agent="${a.id}">Edit</button><button class="mini-btn" data-chat-agent="${a.id}">Chat ↗</button></div></div></article>`).join('')}</div><div class="section-kicker">HOW AGENTS WORK</div><div class="notice info">An agent is a reusable instruction set, not a separate model. Multiple agents can share the same connected model while behaving differently. Give each one a clear role, useful boundaries, and a distinct voice.</div>`}
function arenaPage(){return `${head('Head-to-head testing','Model arena','Give two models the same prompt and compare their answers. Useful for testing quality, speed, style, and consistency.',`<span class="tag">SAME PROMPT · TWO MODELS</span>`)}<div class="arena-grid"><section class="arena-card"><div class="arena-head"><div><strong>01 · Challenger A</strong><div class="arena-label">Left corner</div></div><select class="arena-model" id="modelA"><option value="">Use connected model</option></select></div><div class="arena-output pending" id="outA">Your first response will appear here.</div></section><section class="arena-card"><div class="arena-head"><div><strong>02 · Challenger B</strong><div class="arena-label">Right corner</div></div><select class="arena-model" id="modelB"><option value="">Use connected model</option></select></div><div class="arena-output pending" id="outB">Your second response will appear here.</div></section></div><section class="arena-input"><div class="field"><label for="arenaPrompt">THE CHALLENGE</label><textarea id="arenaPrompt" placeholder="Give both models the exact same challenge… e.g. Design a small ecosystem where three species depend on one another."></textarea></div><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="muted" style="font-size:10px">Responses run independently. In demo mode, you'll see illustrative mock answers.</span><button class="btn primary" id="runArena">⚔ Run matchup</button></div></section><div class="section-kicker">COMPARISON TIP</div><div class="notice info">Change only one variable at a time. To compare models fairly, keep the prompt, system instructions, temperature, and available context the same.</div>`}
function studioPage(){const p=state.prompts.find(x=>x.id===activePrompt)||state.prompts[0];return `${head('Instruction design','Prompt studio','Draft reusable system prompts, load a starting pattern, then test the instruction against your connected model.',`<button class="btn" id="newPrompt">＋ New prompt</button>`)}<div class="studio-layout"><section class="panel"><div class="panel-head"><div><div class="panel-title">Prompt library</div><div class="panel-sub">Your reusable instruction cards.</div></div><span class="tag">${state.prompts.length} SAVED</span></div><div class="panel-body"><div class="template-list">${state.prompts.map(x=>`<button class="template ${x.id===p.id?'active':''}" data-prompt="${x.id}">${escapeHTML(x.name)}<small>${escapeHTML(x.tag||'Custom')}</small></button>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title">Prompt editor</div><div class="panel-sub">Treat instructions as a design surface.</div></div><span class="tag">SYSTEM PROMPT</span></div><div class="panel-body form-stack"><div class="form-row"><div class="field"><label for="promptName">Name</label><input id="promptName" value="${escapeHTML(p.name)}"></div><div class="field"><label for="promptTag">Category</label><input id="promptTag" value="${escapeHTML(p.tag||'Custom')}"></div></div><div class="field"><label for="promptText">Instructions</label><textarea id="promptText" style="min-height:245px">${escapeHTML(p.text)}</textarea><div class="hint">This text is sent as the system message when you test it.</div></div><div class="studio-actions"><button class="btn primary" id="testPrompt">▶ Test prompt</button><button class="btn" id="savePrompt">Save changes</button><button class="btn ghost danger" id="deletePrompt">Delete</button><button class="btn ghost" id="copyPrompt">Copy text</button></div><div id="promptResult" class="prompt-preview">The test response will appear here.</div></div></section></div>`}
function experimentsPage(){return `${head('Repeatable trials','Experiments','Keep a record of the prompts you tried and what came back. Experiment logs are saved locally.',`<button class="btn" id="exportExperiments">↓ Export log</button>`)}${state.experiments.length?state.experiments.slice().reverse().map(x=>`<article class="experiment-card"><div class="experiment-top"><div><div class="experiment-title">${escapeHTML(x.title)}</div><div class="experiment-desc">${escapeHTML(x.kind)} · ${escapeHTML(x.time)} · ${escapeHTML(x.model||'Demo')}</div></div><button class="mini-btn" data-delete-experiment="${x.id}">Remove</button></div><div class="experiment-result"><strong>Prompt</strong>\n${escapeHTML(x.prompt)}\n\n<strong>Result</strong>\n${escapeHTML(x.result||'No result saved.')}</div></article>`).join(''):`<div class="panel"><div class="empty"><div class="empty-icon">⌁</div><strong>No experiments logged yet</strong>Run a prompt in the arena or prompt studio to start building your lab notebook.</div></div>`}<div class="section-kicker">YOUR DATA</div><div class="notice info">Your experiment log is stored in this browser only. Export it as JSON if you want a backup or want to move it to another device.</div>`}
function toolsPage(){return `${head('Utilities & inspection','Tool bench','Small practical tools for working with model inputs and outputs. Everything here runs in your browser.',`<span class="tag">NO MODEL REQUIRED</span>`)}<div class="tool-grid"><section class="tool-card"><div class="panel-head"><div><div class="panel-title">JSON workbench</div><div class="panel-sub">Format, validate, and inspect JSON.</div></div><span class="tag">DATA</span></div><div class="panel-body form-stack"><div class="field"><label for="jsonInput">JSON INPUT</label><textarea id="jsonInput" style="min-height:140px" placeholder='{"agent":"Sage","temperature":0.7}'></textarea></div><div class="actions"><button class="btn primary" id="formatJson">Format JSON</button><button class="btn" id="minifyJson">Minify</button></div><div class="tool-output" id="jsonOutput">Output will appear here.</div></div></section><section class="tool-card"><div class="panel-head"><div><div class="panel-title">Token & text estimator</div><div class="panel-sub">A rough planning estimate, not a tokenizer.</div></div><span class="tag">TEXT</span></div><div class="panel-body form-stack"><div class="field"><label for="estimateInput">PASTE TEXT</label><textarea id="estimateInput" style="min-height:140px" placeholder="Paste a prompt or model response…"></textarea></div><div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px"><div class="stat"><div class="stat-label">Words</div><div class="stat-value" id="wordCount">0</div></div><div class="stat"><div class="stat-label">Characters</div><div class="stat-value" id="charCount">0</div></div><div class="stat"><div class="stat-label">Est. tokens</div><div class="stat-value" id="tokenCount">0</div></div></div><div class="hint">Estimate uses a rough 1 token ≈ 4 characters heuristic. Actual token counts vary by model and language.</div></div></section><section class="tool-card"><div class="panel-head"><div><div class="panel-title">Text diff</div><div class="panel-sub">Spot changes between two prompt drafts.</div></div><span class="tag">COMPARE</span></div><div class="panel-body form-stack"><div class="field"><label for="diffA">VERSION A</label><textarea id="diffA" placeholder="Original text…"></textarea></div><div class="field"><label for="diffB">VERSION B</label><textarea id="diffB" placeholder="Revised text…"></textarea></div><button class="btn primary" id="runDiff">Compare drafts</button><div class="tool-output" id="diffOutput">Your comparison will appear here.</div></div></section><section class="tool-card"><div class="panel-head"><div><div class="panel-title">Quick calculator</div><div class="panel-sub">Evaluate basic arithmetic expressions.</div></div><span class="tag">MATH</span></div><div class="panel-body form-stack"><div class="field"><label for="calcInput">EXPRESSION</label><input id="calcInput" placeholder="(128 * 0.75) / 4 + 16"></div><button class="btn primary" id="calculate">Calculate</button><div class="tool-output" id="calcOutput">Result will appear here.</div><div class="hint">Supports numbers, +, −, ×, ÷, parentheses, and decimals. No variables or code execution.</div></div></section></div>`}
function memoryPage(){return `${head('Persistent context','Memory vault','Save useful facts, preferences, or project notes. Selected memories are attached to chat requests as context.',`<button class="btn primary" id="addMemory">＋ Add memory</button>`)}<div class="panel"><div class="panel-head"><div><div class="panel-title">Your memory fragments</div><div class="panel-sub">Notes are private to this browser profile.</div></div><span class="tag">${state.memories.length} NOTES</span></div><div class="panel-body">${state.memories.length?`<div class="memory-list">${state.memories.map(m=>`<div class="memory-row"><div style="color:var(--aqua)">▤</div><div class="memory-text">${escapeHTML(m.text)}<div class="memory-meta">${escapeHTML(m.created||'Saved locally')}</div></div><button class="mini-btn" data-delete-memory="${m.id}">Delete</button></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">▤</div><strong>A little memory goes a long way.</strong>Add project details or preferences that you want agents to have available in future chats.</div>`}</div></div><div class="section-kicker">CONTEXT CONTROL</div><div class="notice info">All saved notes are included with each chat message while they remain in this vault. Avoid storing passwords, API secrets, or other sensitive information here.</div>`}
function settingsPage(){const s=state.settings;return `${head('Connect your models','Settings','Choose where Orbit sends requests. Demo mode is instant and simulated; live mode requires a reachable model endpoint.',`<button class="btn primary" id="testConnection">Test connection</button>`)}<div class="settings-layout"><section class="panel"><div class="setting-section"><h3>Model connection</h3><p>Connect a local Ollama server or any OpenAI-compatible chat completions endpoint.</p><div class="form-stack"><div class="field"><label for="provider">PROVIDER</label><select id="provider"><option value="demo" ${s.provider==='demo'?'selected':''}>Demo mode — no connection</option><option value="ollama" ${s.provider==='ollama'?'selected':''}>Ollama — local model</option><option value="openai" ${s.provider==='openai'?'selected':''}>OpenAI-compatible API</option></select></div><div class="field"><label for="baseUrl">BASE URL</label><input id="baseUrl" value="${escapeHTML(s.baseUrl)}" placeholder="http://localhost:11434"><div class="hint" id="urlHint">Ollama default: http://localhost:11434</div></div><div class="field"><label for="modelName">MODEL NAME</label><div style="display:flex;gap:8px"><input id="modelName" value="${escapeHTML(s.model)}" placeholder="e.g. qwen2.5-coder:7b" style="flex:1"><button class="btn" id="loadModels">↻ Find models</button></div><div class="hint">Enter a model name exactly as your provider lists it. You can also fetch model names using Find models.</div></div><div class="field"><label for="apiKey">API KEY <span class="muted" style="font-weight:400">(optional for local endpoints)</span></label><input id="apiKey" type="password" value="${escapeHTML(s.apiKey)}" placeholder="sk-…" autocomplete="off"><div class="hint">Stored in this browser's local storage. Requests go only to the endpoint you configure.</div></div><div class="field"><label for="temperature">TEMPERATURE · <span id="tempValue">${Number(s.temperature).toFixed(2)}</span></label><input id="temperature" type="range" min="0" max="2" step="0.05" value="${Number(s.temperature)}" style="accent-color:var(--aqua)"></div><div class="actions"><button class="btn primary" id="saveSettings">Save connection</button><button class="btn ghost" id="resetSettings">Reset to demo</button></div><div id="connectionResult"></div></div></div><div class="setting-section"><h3>Privacy & storage</h3><p>Orbit stores workspace data in your browser using local storage.</p><div class="toggle-row"><div><div style="font-size:11px;font-weight:650">Include memory notes in chats</div><div class="muted" style="font-size:10px">Attach every saved memory to new requests.</div></div><button class="switch ${s.includeMemories!==false?'on':''}" id="memoryToggle" aria-label="Toggle memory context"></button></div><div class="actions" style="margin-top:10px"><button class="btn" id="exportData">↓ Export workspace</button><button class="btn ghost danger" id="clearData">Clear all workspace data</button></div></div></section><aside class="panel"><div class="panel-head"><div><div class="panel-title">Connection guide</div><div class="panel-sub">A few things to know.</div></div></div><div class="panel-body form-stack"><div class="notice info"><strong>Ollama</strong><br>Run Ollama on your computer, pull a model, and use its local address. Default URL: <code>http://localhost:11434</code>. Your browser must be allowed to reach the local server.</div><div class="notice info"><strong>OpenAI-compatible</strong><br>Use the API base URL for a service that supports <code>/v1/chat/completions</code> and <code>/v1/models</code>. Some providers require an API key.</div><div class="notice"><strong>Browser security</strong><br>Some endpoints block browser requests with CORS. That is a server-side setting; Orbit cannot bypass it. For a local-only endpoint, allow your browser origin in the provider's CORS configuration.</div><div class="notice success"><strong>Demo mode</strong><br>Explore every screen without connecting anything. Demo replies are illustrative, not generated by a real model.</div></div></aside></div>`}

function bindChat(){const s=ensureSession();$('#chatAgent').addEventListener('change',e=>{s.agentId=e.target.value;state.activeAgent=e.target.value;save();render()});$('#newChat').addEventListener('click',()=>{const n={id:uid(),title:'Untitled conversation',agentId:state.activeAgent,messages:[],created:nowTime(),updated:'Just now'};state.sessions.push(n);state.activeSession=n.id;save();render()});$('#clearChat').addEventListener('click',()=>{if(!confirm('Clear all messages in this conversation?'))return;s.messages=[];s.title='Untitled conversation';save();render()});$('#editCurrentAgent').addEventListener('click',()=>openAgentModal(s.agentId));$('#renameSession').addEventListener('click',()=>{const v=prompt('Conversation name:',s.title);if(v&&v.trim()){s.title=v.trim();save();render()}});const inp=$('#chatInput');const send=()=>sendChatMessage(inp.value);$('#sendChat').addEventListener('click',send);inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,150)+'px'});$('#chatWindow').scrollTop=$('#chatWindow').scrollHeight}
function addMessage(session,msg){session.messages.push(msg);session.updated=nowTime();if(session.title==='Untitled conversation'&&msg.role==='user')session.title=msg.content.slice(0,42)+(msg.content.length>42?'…':'');save()}
async function sendChatMessage(text){text=text.trim();if(!text||busy)return;const session=ensureSession(),agent=state.agents.find(a=>a.id===session.agentId)||state.agents[0];const inp=$('#chatInput');inp.value='';inp.style.height='auto';addMessage(session,{role:'user',content:text,time:nowTime()});const win=$('#chatWindow');win.innerHTML=session.messages.map(messageHTML).join('')+`<div class="message assistant" id="typingMessage"><div class="avatar">${agent.icon}</div><div><div class="msg-meta">${escapeHTML(agent.name.toUpperCase())} · THINKING</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div></div>`;win.scrollTop=win.scrollHeight;busy=true;$('#sendChat').disabled=true;
 try{const answer=await getCompletion([...session.messages.slice(0,-1),{role:'user',content:text}],agent.instructions,session.messages);$('#typingMessage')?.remove();addMessage(session,{role:'assistant',name:agent.name,icon:agent.icon,content:answer,time:nowTime()});win.innerHTML=session.messages.map(messageHTML).join('');win.scrollTop=win.scrollHeight;state.stats.messages++;save()}catch(err){$('#typingMessage')?.remove();const errText='I could not reach the configured model. '+err.message+'\n\nCheck Settings → endpoint URL, model name, and CORS permissions. Your message is still saved in this conversation.';addMessage(session,{role:'assistant',name:agent.name,icon:agent.icon,content:errText,time:nowTime()});win.innerHTML=session.messages.map(messageHTML).join('');win.scrollTop=win.scrollHeight;save()}finally{busy=false;$('#sendChat').disabled=false;$('#chatInput')?.focus()}}
function getMemoryContext(){return state.settings.includeMemories===false?'':state.memories.map(m=>'- '+m.text).join('\n')}
async function getCompletion(messages,systemPrompt='',allMessages=[]){if(state.settings.provider==='demo')return demoReply(messages[messages.length-1]?.content||'',systemPrompt,allMessages);const s=state.settings;const context=getMemoryContext();const fullSystem=[systemPrompt,context?`\nRelevant saved context:\n${context}`:''].filter(Boolean).join('\n');const apiMessages=[];if(fullSystem)apiMessages.push({role:'system',content:fullSystem});messages.forEach(m=>apiMessages.push({role:m.role,content:m.content}));if(s.provider==='ollama')return ollamaChat(apiMessages);return openAIChat(apiMessages,s.model)}
async function ollamaChat(messages){const s=state.settings;const base=s.baseUrl.replace(/\/$/,'');const res=await fetch(base+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:s.model,messages,stream:false,options:{temperature:Number(s.temperature)}})});if(!res.ok)throw new Error(`Ollama returned HTTP ${res.status}.`);const data=await res.json();return data.message?.content||'(The model returned an empty response.)'}
async function openAIChat(messages,modelOverride){const s=state.settings;const base=s.baseUrl.replace(/\/$/,'').replace(/\/chat\/completions$/,'');const headers={'Content-Type':'application/json'};if(s.apiKey)headers.Authorization='Bearer '+s.apiKey;const res=await fetch(base+'/chat/completions',{method:'POST',headers,body:JSON.stringify({model:modelOverride||s.model,messages,temperature:Number(s.temperature),stream:false})});if(!res.ok){let detail='';try{detail=(await res.text()).slice(0,300)}catch{}throw new Error(`API returned HTTP ${res.status}. ${detail}`)}const data=await res.json();return data.choices?.[0]?.message?.content??'(The model returned no text content.)'}
function demoReply(prompt,system,history){const p=prompt.toLowerCase();let answer;if(/hello|hi\b|hey/.test(p))answer='Hey! Welcome to the lab. Give me a weird question, a half-formed idea, or a problem you want to pull apart. We can experiment with it.';else if(/code|program|html|javascript|python|game/.test(p))answer='I would approach this as a small, testable build.\n\n1. Define the smallest version that proves the core interaction.\n2. Separate the interface from the underlying logic.\n3. Add input validation and a clear failure state.\n4. Test the normal path, edge cases, and a fresh reload.\n\nI am in demo mode, so this is an illustrative response rather than code generated by a connected model. Connect a model in Settings for real output.';else if(/remember|memory|what did i/.test(p))answer='I can use the messages in this conversation and the notes in your Memory Vault when connected to a real model. The demo can show the structure, but it does not reason over your full workspace like a model would.';else answer=`Let's explore that.\n\nA useful first move is to separate the idea into three parts: what you want to happen, what constraints shape it, and what would count as a successful result. From there, we can make a small experiment instead of guessing.\n\nOne angle worth testing: ${prompt.length>100?'break the request into a few concrete hypotheses and test them independently.':'try an intentionally simple version first, then add complexity only where it improves the result.'}\n\n[Demo response — connect an AI model in Settings to get a real answer.]`;if(system.toLowerCase().includes('creative')||system.toLowerCase().includes('spark'))answer='A fun direction: turn the problem sideways. Instead of asking what the obvious solution looks like, imagine the system was designed by someone with a completely different goal. What would they optimize for?\n\nThat contrast can reveal a more original design.\n\n'+answer;return answer}
function bindAgents(){$('#createAgent').addEventListener('click',()=>openAgentModal());$$('[data-edit-agent]').forEach(b=>b.addEventListener('click',()=>openAgentModal(b.dataset.editAgent)));$$('[data-chat-agent]').forEach(b=>b.addEventListener('click',()=>{state.activeAgent=b.dataset.chatAgent;const s={id:uid(),title:'Untitled conversation',agentId:state.activeAgent,messages:[],created:nowTime(),updated:'Just now'};state.sessions.push(s);state.activeSession=s.id;save();go('chat')}))}
function openAgentModal(id){const existing=state.agents.find(a=>a.id===id);$('#modalTitle').textContent=existing?'Edit agent':'Forge a new agent';$('#modalBody').innerHTML=`<form id="agentForm" class="form-stack"><div class="form-row"><div class="field"><label for="agentName">Agent name</label><input id="agentName" required maxlength="30" value="${escapeHTML(existing?.name||'')}" placeholder="e.g. Atlas"></div><div class="field"><label for="agentIcon">Icon / emoji</label><input id="agentIcon" maxlength="4" value="${escapeHTML(existing?.icon||'✧')}" placeholder="✧"></div></div><div class="form-row"><div class="field"><label for="agentType">Specialty</label><input id="agentType" value="${escapeHTML(existing?.type||'General assistant')}" placeholder="e.g. Research partner"></div><div class="field"><label for="agentTone">Personality / tone</label><input id="agentTone" value="${escapeHTML(existing?.tone||'Thoughtful, curious')}" placeholder="e.g. Blunt, funny, analytical"></div></div><div class="field"><label for="agentDesc">Short description</label><input id="agentDesc" value="${escapeHTML(existing?.description||'')}" placeholder="What makes this agent useful?"></div><div class="field"><label for="agentInstructions">Core instructions</label><textarea id="agentInstructions" style="min-height:155px" placeholder="You are… Your goals are… You should…">${escapeHTML(existing?.instructions||'')}</textarea><div class="hint">These instructions become the agent's system prompt. Specific behavior beats vague personality labels.</div></div><div class="actions"><button class="btn primary" type="submit">${existing?'Save agent':'Create agent'}</button>${existing?'<button class="btn ghost danger" type="button" id="deleteAgent">Delete agent</button>':''}</div></form>`;$('#modalBackdrop').classList.add('show');$('#agentForm').addEventListener('submit',e=>{e.preventDefault();const a={id:existing?.id||uid(),name:$('#agentName').value.trim(),icon:$('#agentIcon').value.trim()||'✧',type:$('#agentType').value.trim(),tone:$('#agentTone').value.trim(),description:$('#agentDesc').value.trim(),instructions:$('#agentInstructions').value.trim(),color:existing?.color||'#71ead7'};if(!a.name||!a.instructions){toast('Add a name and core instructions.');return}if(existing)Object.assign(existing,a);else state.agents.push(a);save();closeModal();render();toast(existing?'Agent updated.':'Agent forged.')});if(existing)$('#deleteAgent').addEventListener('click',()=>{if(!confirm(`Delete ${existing.name}? Existing conversations keep their saved messages.`))return;state.agents=state.agents.filter(x=>x.id!==existing.id);if(!state.agents.length)state.agents=defaultAgents.slice(0,1);if(state.activeAgent===existing.id)state.activeAgent=state.agents[0].id;save();closeModal();render();toast('Agent deleted.')})}
function closeModal(){$('#modalBackdrop').classList.remove('show')};$('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});
function bindArena(){const fill=async()=>{if(state.settings.provider==='demo')return;try{const models=await fetchModels(false);['modelA','modelB'].forEach(id=>{const sel=$('#'+id),old=sel.value;sel.innerHTML='<option value="">Use connected model</option>'+models.map(m=>`<option value="${escapeHTML(m)}">${escapeHTML(m)}</option>`).join('');if(old)sel.value=old})}catch{}};fill();$('#runArena').addEventListener('click',runArena)}
async function runArena(){const prompt=$('#arenaPrompt').value.trim();if(!prompt){toast('Write a challenge first.');return}if(busy)return;busy=true;$('#runArena').disabled=true;$('#outA').textContent='Thinking…';$('#outB').textContent='Thinking…';$('#outA').classList.add('pending');$('#outB').classList.add('pending');const a=$('#modelA').value,b=$('#modelB').value;try{const [ra,rb]=await Promise.all([arenaCompletion(prompt,a,'A'),arenaCompletion(prompt,b,'B')]);$('#outA').textContent=ra;$('#outB').textContent=rb;state.stats.arenaRuns++;state.experiments.push({id:uid(),title:'Arena matchup',kind:'Model arena',time:nowTime(),model:`${a||state.settings.model||'Demo'} vs ${b||state.settings.model||'Demo'}`,prompt,result:`CHALLENGER A\n${ra}\n\nCHALLENGER B\n${rb}`});save()}catch(e){$('#outA').textContent='Error: '+e.message;$('#outB').textContent='One or both requests failed.'}finally{busy=false;$('#runArena').disabled=false;$('#outA').classList.remove('pending');$('#outB').classList.remove('pending')}}
async function arenaCompletion(prompt,model,label){if(state.settings.provider==='demo')return demoReply(prompt+' (Challenger '+label+')','',[]);const s=state.settings;const msgs=[{role:'system',content:'You are participating in a controlled model comparison. Answer the user directly and do not mention being evaluated.'},{role:'user',content:prompt}];if(s.provider==='ollama'){const base=s.baseUrl.replace(/\/$/,'');const r=await fetch(base+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model||s.model,messages:msgs,stream:false,options:{temperature:Number(s.temperature)}})});if(!r.ok)throw new Error('Ollama HTTP '+r.status);return (await r.json()).message?.content||''}return openAIChat(msgs,model||s.model)}
function bindStudio(){ $$('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{activePrompt=b.dataset.prompt;render()}));$('#savePrompt').addEventListener('click',savePrompt);$('#testPrompt').addEventListener('click',testPrompt);$('#copyPrompt').addEventListener('click',()=>copyText($('#promptText').value));$('#newPrompt').addEventListener('click',()=>{const name=prompt('Name this prompt:');if(!name?.trim())return;const p={id:uid(),name:name.trim(),tag:'Custom',text:'You are a helpful assistant.\n\nYour goals:\n-\n\nBoundaries:\n-'};state.prompts.push(p);activePrompt=p.id;save();render()});$('#deletePrompt').addEventListener('click',()=>{if(state.prompts.length<=1){toast('Keep at least one prompt.');return}if(!confirm('Delete this prompt?'))return;state.prompts=state.prompts.filter(p=>p.id!==activePrompt);activePrompt=state.prompts[0].id;save();render()})}
function savePrompt(){const p=state.prompts.find(x=>x.id===activePrompt);p.name=$('#promptName').value.trim()||'Untitled';p.tag=$('#promptTag').value.trim()||'Custom';p.text=$('#promptText').value;save();toast('Prompt saved.')}
async function testPrompt(){const p=$('#promptText').value.trim();if(!p){toast('Write some instructions first.');return}const out=$('#promptResult');out.textContent='Running test…';try{const result=await getCompletion([{role:'user',content:'Please introduce yourself and explain how you will approach your work.'}],p);out.textContent=result;state.stats.promptRuns++;state.experiments.push({id:uid(),title:$('#promptName').value||'Prompt test',kind:'Prompt studio',time:nowTime(),model:state.settings.model||'Demo',prompt:p,result});save()}catch(e){out.textContent='Test failed: '+e.message}}
function bindTools(){const estimate=()=>{const t=$('#estimateInput').value;$('#wordCount').textContent=t.trim()?t.trim().split(/\s+/).length:0;$('#charCount').textContent=t.length;$('#tokenCount').textContent=Math.ceil(t.length/4)};$('#estimateInput').addEventListener('input',estimate);$('#formatJson').addEventListener('click',()=>jsonAction(true));$('#minifyJson').addEventListener('click',()=>jsonAction(false));$('#runDiff').addEventListener('click',runTextDiff);$('#calculate').addEventListener('click',calculate);$('#calcInput').addEventListener('keydown',e=>{if(e.key==='Enter')calculate()})}
function jsonAction(pretty){const out=$('#jsonOutput');try{const parsed=JSON.parse($('#jsonInput').value);out.classList.remove('error');out.textContent=JSON.stringify(parsed,null,pretty?2:0)}catch(e){out.classList.add('error');out.textContent='Invalid JSON: '+e.message}}
function runTextDiff(){const a=$('#diffA').value.split(/\s+/),b=$('#diffB').value.split(/\s+/);let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;let j=0;while(j<a.length-i&&j<b.length-i&&a[a.length-1-j]===b[b.length-1-j])j++;const removed=a.slice(i,a.length-j).join(' '),added=b.slice(i,b.length-j).join(' ');$('#diffOutput').textContent=`First difference near word ${i+1}.\n\nRemoved: ${removed||'(nothing)'}\n\nAdded: ${added||'(nothing)'}\n\nWord count: ${a.filter(Boolean).length} → ${b.filter(Boolean).length}`}
function calculate(){const expr=$('#calcInput').value.trim();const out=$('#calcOutput');try{if(!/^[0-9+\-*/().%\s]+$/.test(expr))throw Error('Only basic arithmetic characters are allowed.');const tokens=expr.match(/\d*\.?\d+|[()+\-*/%]/g)||[];let pos=0;function primary(){const t=tokens[pos++];if(t==='('){const v=add();if(tokens[pos++]!==')')throw Error('Missing closing parenthesis.');return v}if(t==='-')return -primary();if(t==='+')return primary();if(t===undefined||!/^\d*\.?\d+$/.test(t))throw Error('Expected a number.');return Number(t)}function mul(){let v=primary();while(['*','/','%'].includes(tokens[pos])){const op=tokens[pos++],r=primary();if((op==='/'||op==='%')&&r===0)throw Error('Cannot divide by zero.');v=op==='*'?v*r:op==='/'?v/r:v%r}return v}function add(){let v=mul();while(['+','-'].includes(tokens[pos])){const op=tokens[pos++],r=mul();v=op==='+'?v+r:v-r}return v}const result=add();if(pos!==tokens.length||!Number.isFinite(result))throw Error('Invalid expression.');out.classList.remove('error');out.textContent=String(Number(result.toPrecision(12)))}catch(e){out.classList.add('error');out.textContent=e.message}}
function bindMemory(){$('#addMemory').addEventListener('click',()=>{const text=prompt('What should your agents know?');if(!text?.trim())return;state.memories.push({id:uid(),text:text.trim(),created:new Date().toLocaleString()});save();render();toast('Memory saved.')});$$('[data-delete-memory]').forEach(b=>b.addEventListener('click',()=>{state.memories=state.memories.filter(m=>m.id!==b.dataset.deleteMemory);save();render()}))}
function bindExperiments(){$('#exportExperiments').addEventListener('click',()=>downloadFile('orbit-experiments.json',JSON.stringify(state.experiments,null,2),'application/json'));$$('[data-delete-experiment]').forEach(b=>b.addEventListener('click',()=>{state.experiments=state.experiments.filter(x=>x.id!==b.dataset.deleteExperiment);save();render()}))}
function bindSettings(){const provider=$('#provider'),url=$('#baseUrl');provider.addEventListener('change',()=>{$('#urlHint').textContent=provider.value==='ollama'?'Ollama default: http://localhost:11434':provider.value==='openai'?'Use the API base URL, usually ending in /v1.':'No endpoint is needed in demo mode.';if(provider.value==='ollama'&&!url.value)url.value='http://localhost:11434'});$('#temperature').addEventListener('input',e=>$('#tempValue').textContent=Number(e.target.value).toFixed(2));$('#saveSettings').addEventListener('click',()=>{state.settings.provider=provider.value;state.settings.baseUrl=url.value.trim().replace(/\/$/,'');state.settings.model=$('#modelName').value.trim();state.settings.apiKey=$('#apiKey').value;state.settings.temperature=Number($('#temperature').value);save();updateConnection();$('#connectionResult').innerHTML='<div class="notice success">Settings saved in this browser.</div>';toast('Connection settings saved.')});$('#resetSettings').addEventListener('click',()=>{state.settings={...freshState().settings};save();render();toast('Switched to demo mode.')});$('#testConnection').addEventListener('click',testConnection);$('#loadModels').addEventListener('click',async()=>{saveSettingsSilently();const r=$('#connectionResult');r.innerHTML='<div class="notice info">Looking for models…</div>';try{const models=await fetchModels(true);if(models.length){r.innerHTML='<div class="notice success">Found models: '+models.map(escapeHTML).join(', ')+'</div>';if(!state.settings.model){$('#modelName').value=models[0]}}else r.innerHTML='<div class="notice">No models returned by this endpoint.</div>'}catch(e){r.innerHTML='<div class="notice">Could not load models: '+escapeHTML(e.message)+'</div>'}});$('#memoryToggle').addEventListener('click',e=>{state.settings.includeMemories=state.settings.includeMemories===false;save();e.currentTarget.classList.toggle('on',state.settings.includeMemories!==false)});$('#exportData').addEventListener('click',()=>downloadFile('orbit-workspace-backup.json',JSON.stringify(state,null,2),'application/json'));$('#clearData').addEventListener('click',()=>{if(!confirm('This permanently clears agents, chats, memories, prompts, and experiments stored in this browser. Continue?'))return;state=freshState();save();render();toast('Workspace cleared.')})}
function saveSettingsSilently(){state.settings.provider=$('#provider').value;state.settings.baseUrl=$('#baseUrl').value.trim().replace(/\/$/,'');state.settings.model=$('#modelName').value.trim();state.settings.apiKey=$('#apiKey').value;state.settings.temperature=Number($('#temperature').value);save();updateConnection()}
async function fetchModels(showError=true){const s=state.settings;const base=s.baseUrl.replace(/\/$/,'');if(s.provider==='demo')return[];const headers={};if(s.apiKey)headers.Authorization='Bearer '+s.apiKey;let res;if(s.provider==='ollama')res=await fetch(base+'/api/tags',{headers});else res=await fetch(base+'/models',{headers});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();return s.provider==='ollama'?(data.models||[]).map(x=>x.name):((data.data||data.models||[]).map(x=>typeof x==='string'?x:x.id).filter(Boolean))}
async function testConnection(){saveSettingsSilently();const r=$('#connectionResult');if(state.settings.provider==='demo'){r.innerHTML='<div class="notice success">Demo mode is ready. No external model is connected.</div>';return}r.innerHTML='<div class="notice info">Testing endpoint…</div>';try{const models=await fetchModels();r.innerHTML='<div class="notice success">Connected to the model endpoint. '+(models.length?`Found ${models.length} model(s).`:'Endpoint responded, but no model list was returned.')+'</div>';if(models.length&&!state.settings.model){$('#modelName').value=models[0];state.settings.model=models[0];save();updateConnection()}}catch(e){r.innerHTML='<div class="notice">Connection failed: '+escapeHTML(e.message)+' Check the URL, server status, and CORS settings.</div>'}}
function copyText(text){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard.')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied to clipboard.')}catch{toast('Copy is unavailable in this browser.')}t.remove()}
function downloadFile(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
// Initial workspace render
render();
</script>
