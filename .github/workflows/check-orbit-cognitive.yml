name: Check ORBIT Cognitive v2.3 Conversational
on:
  push:
    branches: [main, orbit-v2.3-ultrachat]
    paths:
      - "orbit/cognitive/**"
      - ".github/workflows/check-orbit-cognitive.yml"
  pull_request:
    paths:
      - "orbit/cognitive/**"
      - ".github/workflows/check-orbit-cognitive.yml"
  workflow_dispatch:
concurrency:
  group: orbit-cognitive-ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lightweight CPU test dependencies
        run: |
          python -m pip install --upgrade pip numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile Cognitive scripts
        run: python -m py_compile orbit/cognitive/core.py orbit/cognitive/models.py orbit/cognitive/language.py orbit/cognitive/train.py orbit/cognitive/chat.py orbit/cognitive/bundle_kaggle.py orbit/cognitive/tests/test_cognitive.py
      - name: Run unit tests
        run: python -m unittest discover -s orbit/cognitive/tests -v
      - name: Build self-contained Kaggle script
        run: |
          python orbit/cognitive/bundle_kaggle.py --output "$RUNNER_TEMP/orbit-cognitive-bundle/train.py"
          python -m py_compile "$RUNNER_TEMP/orbit-cognitive-bundle/train.py"
      - name: Run CPU smoke training from the Kaggle bundle
        run: python "$RUNNER_TEMP/orbit-cognitive-bundle/train.py" --device cpu --smoke --output "$RUNNER_TEMP/orbit-cognitive-smoke"
      - name: Smoke-test trained checkpoint loading and inference
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from orbit.cognitive.chat import OrbitCognitive
          model = Path(os.environ["RUNNER_TEMP"]) / "orbit-cognitive-smoke"
          bot = OrbitCognitive(model, device="cpu", max_new_tokens=48, temperature=0.0)
          answer = bot.answer("What is rain?")
          unknown = bot.answer("What is flibbertigibbet?")
          assert isinstance(answer, str) and answer.strip()
          assert isinstance(unknown, str) and unknown.strip()
          assert len(bot.history) == 2
          print("Generated known-concept response:", answer)
          print("Generated unknown-concept response:", unknown)
          PY
      - name: Verify smoke-training archive
        run: |
          test -s "$RUNNER_TEMP/orbit-cognitive-smoke.zip"
          python - <<'PY'
          import json, zipfile, os, tempfile, subprocess, sys
          path = os.path.join(os.environ["RUNNER_TEMP"], "orbit-cognitive-smoke.zip")
          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              required = {"perception.pt", "association.pt", "memory.pt", "generator.pt", "config.json", "training_report.json", "chat.py", "core.py", "models.py", "language.py", "tokenizer.json", "README.txt", "DATA_SOURCES.txt", "run_orbit.bat"}
              missing = required - names
              if missing:
                  raise SystemExit(f"Missing smoke archive files: {sorted(missing)}")
              report = json.loads(z.read("training_report.json"))
              assert report["status"] == "smoke_test_only"
              assert report["all_students_randomly_initialised"] is True
              assert report["config"]["language_generator"]["from_scratch"] is True
              assert "run_orbit.bat" in report["runtime_files"]
              assert "DATA_SOURCES.txt" in report["runtime_files"]
              with tempfile.TemporaryDirectory() as folder:
                  z.extractall(folder)
                  result = subprocess.run(
                      [sys.executable, "chat.py", "--model", ".", "--device", "cpu",
                       "--max-new-tokens", "8", "--temperature", "0"],
                      cwd=folder, input="/exit", text=True, capture_output=True, timeout=120
                  )
                  assert result.returncode == 0, result.stderr
                  assert "conversational neural generator" in result.stdout
          PY
