name: Recover ORBIT Seed v0.2 Kaggle output

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-orbit-v02.yml"

permissions:
  contents: write

concurrency:
  group: orbit-v02-kaggle-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}

    steps:
      - name: Check out ORBIT
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Resolve the real notebook slug from Kaggle
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" || -z "${KAGGLE_USERNAME:-}" ]]; then
            echo "::error::Kaggle credentials are missing."
            exit 1
          fi
          kaggle kernels list --mine --search "ORBIT Seed v0.2" --format json > "$RUNNER_TEMP/orbit-kernels.json"
          KERNEL_ID="$(python - "$RUNNER_TEMP/orbit-kernels.json" <<'PY'
          import json
          import sys
          rows = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [row for row in rows if row.get("title") == "ORBIT Seed v0.2 Fine-tuning"]
          if len(matches) != 1:
              refs = [row.get("ref") for row in matches]
              raise SystemExit(f"Expected one exact ORBIT notebook; matches={refs}")
          ref = matches[0].get("ref")
          if not ref or ref.count("/") != 1:
              raise SystemExit(f"Kaggle returned an invalid notebook ref: {ref!r}")
          print(ref)
          PY
          )"
          echo "Resolved Kaggle notebook: $KERNEL_ID"
          echo "KERNEL_ID=$KERNEL_ID" >> "$GITHUB_ENV"

      - name: Wait for the existing Kaggle run
        shell: bash
        run: |
          set -euo pipefail
          completed=0
          for attempt in $(seq 1 320); do
            if ! status="$(kaggle kernels status "$KERNEL_ID" 2>&1)"; then
              echo "$status"
              echo "::error::Kaggle rejected the resolved notebook reference. The workflow will stop instead of polling a wrong slug."
              exit 1
            fi
            echo "$status"
            if echo "$status" | grep -Eiq 'complete|completed|succeeded|finished'; then
              completed=1
              break
            fi
            if echo "$status" | grep -Eiq 'error|failed|cancelled|canceled'; then
              echo "::error::Kaggle reported that the notebook run failed."
              kaggle kernels logs "$KERNEL_ID" || true
              exit 1
            fi
            sleep 60
          done
          if (( completed == 0 )); then
            echo "::error::Timed out waiting for the existing Kaggle run."
            exit 1
          fi

      - name: Download and validate the trained model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbit-v02-output" "$RUNNER_TEMP/orbit-v02-extracted"
          kaggle kernels output "$KERNEL_ID" -p "$RUNNER_TEMP/orbit-v02-output" --force
          ARCHIVE="$(find "$RUNNER_TEMP/orbit-v02-output" -type f -name 'orbit-seed-v0.2.zip' -print -quit)"
          if [[ -z "$ARCHIVE" || ! -s "$ARCHIVE" ]]; then
            echo "::error::Kaggle output archive orbit-seed-v0.2.zip was not found."
            find "$RUNNER_TEMP/orbit-v02-output" -maxdepth 4 -type f -printf '%p (%s bytes)\n'
            exit 1
          fi
          python -m zipfile -e "$ARCHIVE" "$RUNNER_TEMP/orbit-v02-extracted"
          test -s "$RUNNER_TEMP/orbit-v02-extracted/training_report.json"
          test -s "$RUNNER_TEMP/orbit-v02-extracted/config.json"
          test -s "$RUNNER_TEMP/orbit-v02-extracted/tokenizer.json"
          find "$RUNNER_TEMP/orbit-v02-extracted" -maxdepth 1 -name 'model*.safetensors' -size +1M | grep -q .
          echo "ORBIT_V02_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "ORBIT_V02_EXTRACTED=$RUNNER_TEMP/orbit-v02-extracted" >> "$GITHUB_ENV"
          sha256sum "$ARCHIVE"

      - name: Save the training report
        shell: bash
        run: |
          set -euo pipefail
          cp "$ORBIT_V02_EXTRACTED/training_report.json" orbit/seed_model_v0.2/training_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orbit/seed_model_v0.2/training_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record recovered ORBIT Seed v0.2 training results"
            git push origin HEAD:main
          fi

      - name: Publish the model release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="orbit-seed-v0.2"
          NOTES="$RUNNER_TEMP/orbit-v02-release-notes.md"
          cat > "$NOTES" <<'EOF'
          ORBIT Seed v0.2 is a fine-tuned derivative of HuggingFaceTB/SmolLM2-360M.
          It is not a from-scratch model. This release contains the merged checkpoint,
          tokenizer, upstream notices, and the held-out training report.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ORBIT_V02_ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$TAG" "$ORBIT_V02_EXTRACTED/training_report.json" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ORBIT_V02_ARCHIVE" "$ORBIT_V02_EXTRACTED/training_report.json" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ORBIT Seed v0.2 — SmolLM2-360M fine-tune" \
              --notes-file "$NOTES" \
              --target main
          fi
