name: Publish ORBIT v0.3 Scratch checkpoint

on:
  push:
    branches: [main]
    paths:
      - "orbit/seed_model_v0.3_scratch/PUBLISH_CHECKPOINT.txt"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out ORBIT
        uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Verify completed Kaggle training and download checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}"
          test -n "${KAGGLE_USERNAME:-}"
          KERNEL_ID="$KAGGLE_USERNAME/orbit-seed-v0-3-scratch-training"
          STATUS="$(kaggle kernels status "$KERNEL_ID")"
          echo "$STATUS"
          echo "$STATUS" | grep -Eiq 'complete|completed|succeeded|finished'
          mkdir -p "$RUNNER_TEMP/orbit-output" "$RUNNER_TEMP/orbit-extracted"
          kaggle kernels output "$KERNEL_ID" -p "$RUNNER_TEMP/orbit-output" --force
          ARCHIVE="$(find "$RUNNER_TEMP/orbit-output" -type f -name 'orbit-seed-v0.3-scratch.zip' -print -quit)"
          test -n "$ARCHIVE"
          test -s "$ARCHIVE"
          python -m zipfile -e "$ARCHIVE" "$RUNNER_TEMP/orbit-extracted"
          for FILE in model.safetensors tokenizer.model config.json training_report.json; do
            test -s "$RUNNER_TEMP/orbit-extracted/$FILE"
          done
          echo "ORBIT_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "ORBIT_EXTRACTED=$RUNNER_TEMP/orbit-extracted" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/orbit-extracted/training_report.json" | tee "$RUNNER_TEMP/training_report.json"

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="orbit-seed-v0.3-scratch"
          NOTES="$RUNNER_TEMP/orbit-release-notes.md"
          cat > "$NOTES" <<'EOF'
          ORBIT Seed v0.3 Scratch is a small experimental causal language model initialized from random weights and trained from scratch.

          The release archive contains the model checkpoint, tokenizer, configuration, training report, and resumable pretraining state where included. SmolLM3-3B supplied generated text examples only; no teacher weights were copied into ORBIT.

          This is an experimental first-stage model, not a frontier assistant. See the repository README for usage and limitations.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ORBIT_ARCHIVE" "$ORBIT_EXTRACTED/training_report.json" "$ORBIT_EXTRACTED/config.json" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ORBIT_ARCHIVE" "$ORBIT_EXTRACTED/training_report.json" "$ORBIT_EXTRACTED/config.json" --repo "$GITHUB_REPOSITORY" --title "ORBIT Seed v0.3 Scratch" --notes-file "$NOTES"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
