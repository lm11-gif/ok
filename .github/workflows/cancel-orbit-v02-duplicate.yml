name: Cancel duplicate ORBIT v0.2 run

on:
  push:
    branches: [main]
    paths:
      - "orbit/seed_model_v0.2/CANCEL_DUPLICATE.txt"

permissions:
  actions: write

jobs:
  cancel-duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the redundant queued run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 41742279149 --repo "$GITHUB_REPOSITORY" || true
          gh run view 41742279149 --repo "$GITHUB_REPOSITORY" || true
