name: Train ORBIT Seed v0.3 Scratch on Kaggle GPU

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Teacher-supervise ORBIT Seed v0.2 with DPO"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "orbit/seed_model_v0.3_scratch/START_TRAINING.txt"

permissions:
  contents: write

concurrency:
  group: orbit-v03-scratch-kaggle-training
  cancel-in-progress: false

jobs:
  train:
    concurrency:
      group: orbit-kaggle-gpu-shared
      cancel-in-progress: false
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out ORBIT
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check scratch trainer syntax
        run: python -m py_compile orbit/seed_model_v0.3_scratch/train_scratch.py orbit/seed_model_v0.3_scratch/chat.py

      - name: Validate Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" || -z "${KAGGLE_USERNAME:-}" ]]; then
            echo "::error::Add KAGGLE_API_TOKEN and KAGGLE_USERNAME in repository Actions secrets."
            exit 1
          fi

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Prepare private Kaggle scratch-training kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbit-v03-scratch-kernel"
          cp orbit/seed_model_v0.3_scratch/train_scratch.py "$RUNNER_TEMP/orbit-v03-scratch-kernel/train_scratch.py"
          cat > "$RUNNER_TEMP/orbit-v03-scratch-kernel/kernel-metadata.json" <<EOF
          {
            "id": "$KAGGLE_USERNAME/orbit-seed-v0-3-scratch-training",
            "title": "ORBIT Seed v0.3 Scratch Training",
            "code_file": "train_scratch.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": "true",
            "enable_gpu": "true",
            "enable_internet": "true",
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": []
          }
          EOF
          cat "$RUNNER_TEMP/orbit-v03-scratch-kernel/kernel-metadata.json"

      - name: Submit the scratch-training job to Kaggle
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$RUNNER_TEMP/orbit-v03-scratch-kernel" --timeout 43200 --accelerator NvidiaTeslaT4

          kaggle kernels list --mine --search "ORBIT Seed v0.3 Scratch Training" --format json \
            > "$RUNNER_TEMP/orbit-v03-kernels.json"
          KERNEL_ID="$(python - "$RUNNER_TEMP/orbit-v03-kernels.json" <<'PY'
          import json
          import sys
          rows = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [r for r in rows if r.get("title") == "ORBIT Seed v0.3 Scratch Training"]
          if len(matches) != 1:
              raise SystemExit("Expected one ORBIT scratch notebook; found: " + repr([m.get("ref") for m in matches]))
          print(matches[0]["ref"])
          PY
          )"
          echo "Kaggle confirmed notebook reference: $KERNEL_ID"
          echo "KERNEL_ID=$KERNEL_ID" >> "$GITHUB_ENV"

      - name: Wait for Kaggle training to finish
        shell: bash
        run: |
          set -euo pipefail
          completed=0
          for attempt in $(seq 1 320); do
            if ! status="$(kaggle kernels status "$KERNEL_ID" 2>&1)"; then
              echo "$status"
              echo "::error::Could not read status for canonical Kaggle ref '$KERNEL_ID'."
              exit 1
            fi
            echo "$status"
            if echo "$status" | grep -Eiq 'complete|completed|succeeded|finished'; then
              completed=1
              break
            fi
            if echo "$status" | grep -Eiq 'error|failed|cancelled|canceled'; then
              echo "::error::Kaggle reported scratch-training failure."
              kaggle kernels logs "$KERNEL_ID" || true
              exit 1
            fi
            sleep 60
          done
          if (( completed == 0 )); then
            echo "::error::Timed out waiting for Kaggle scratch training."
            exit 1
          fi

      - name: Download and validate the scratch checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbit-v03-scratch-output" "$RUNNER_TEMP/orbit-v03-scratch-extracted"
          kaggle kernels output "$KERNEL_ID" -p "$RUNNER_TEMP/orbit-v03-scratch-output" --force
          ARCHIVE="$(find "$RUNNER_TEMP/orbit-v03-scratch-output" -type f -name 'orbit-seed-v0.3-scratch.zip' -print -quit)"
          if [[ -z "$ARCHIVE" || ! -s "$ARCHIVE" ]]; then
            echo "::error::Scratch checkpoint archive was not found."
            find "$RUNNER_TEMP/orbit-v03-scratch-output" -maxdepth 4 -type f -printf '%p (%s bytes)\n'
            exit 1
          fi
          python -m zipfile -e "$ARCHIVE" "$RUNNER_TEMP/orbit-v03-scratch-extracted"
          test -s "$RUNNER_TEMP/orbit-v03-scratch-extracted/model.safetensors"
          test -s "$RUNNER_TEMP/orbit-v03-scratch-extracted/tokenizer.model"
          test -s "$RUNNER_TEMP/orbit-v03-scratch-extracted/config.json"
          test -s "$RUNNER_TEMP/orbit-v03-scratch-extracted/training_report.json"
          echo "ORBIT_SCRATCH_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "ORBIT_SCRATCH_EXTRACTED=$RUNNER_TEMP/orbit-v03-scratch-extracted" >> "$GITHUB_ENV"
          sha256sum "$ARCHIVE"

      - name: Save the scratch training report in the repository
        shell: bash
        run: |
          set -euo pipefail
          cp "$ORBIT_SCRATCH_EXTRACTED/training_report.json" orbit/seed_model_v0.3_scratch/training_report.json
          cp "$ORBIT_SCRATCH_EXTRACTED/config.json" orbit/seed_model_v0.3_scratch/config.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orbit/seed_model_v0.3_scratch/training_report.json orbit/seed_model_v0.3_scratch/config.json
          if ! git diff --cached --quiet; then
            git commit -m "Record ORBIT v0.3 scratch training results"
            git push origin HEAD:main
          fi

      - name: Publish the scratch model release
        shell: bash
        run: |
          set -euo pipefail
          TAG="orbit-seed-v0.3-scratch"
          NOTES="$RUNNER_TEMP/orbit-v03-scratch-release-notes.md"
          cat > "$NOTES" <<'EOF'
          ORBIT Seed v0.3 Scratch is initialized from random weights.
          Its tokenizer is trained from the FineWeb-Edu corpus. SmolLM3-3B is
          used only to generate extra text examples; no teacher weights are
          copied into the student. The archive includes model weights,
          tokenizer, config, notices, and training report.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ORBIT_SCRATCH_ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$TAG" "$ORBIT_SCRATCH_EXTRACTED/training_report.json" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ORBIT_SCRATCH_ARCHIVE" "$ORBIT_SCRATCH_EXTRACTED/training_report.json" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ORBIT Seed v0.3 Scratch" \
              --notes-file "$NOTES" \
              --target main
          fi

      - name: Publish scratch training summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ORBIT Seed v0.3 Scratch"
            echo ""
            echo "Kaggle kernel: $KERNEL_ID"
            if [[ -f orbit/seed_model_v0.3_scratch/training_report.json ]]; then
              echo ""
              cat orbit/seed_model_v0.3_scratch/training_report.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
