name: Import ORBIT Seed model binaries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-orbit-model.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of the release containing model.safetensors and tokenizer.model"
        required: true
        type: string

permissions:
  contents: write

jobs:
  import-model:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.release.assets.*.name, 'model.safetensors') &&
        contains(github.event.release.assets.*.name, 'tokenizer.model')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the two model files from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || 'orbit-seed-upload' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbit-import"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "model.safetensors" \
            --pattern "tokenizer.model" \
            --dir "$RUNNER_TEMP/orbit-import"

      - name: Validate the model files
        env:
          IMPORT_DIR: ${{ runner.temp }}/orbit-import
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          folder = Path(os.environ["IMPORT_DIR"])
          model = folder / "model.safetensors"
          tokenizer = folder / "tokenizer.model"

          for path in (model, tokenizer):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty file: {path}")
              print(f"Found {path.name}: {path.stat().st_size:,} bytes")

          if model.stat().st_size > 50 * 1024 * 1024:
              raise SystemExit("Unexpectedly large model file.")

          with model.open("rb") as f:
              prefix = f.read(8)
              if len(prefix) != 8:
                  raise SystemExit("model.safetensors is truncated.")
              header_length = int.from_bytes(prefix, "little")
              if header_length <= 0 or header_length > model.stat().st_size - 8:
                  raise SystemExit("model.safetensors has an invalid header length.")
              header = json.loads(f.read(header_length))
              tensor_names = [k for k in header if k != "__metadata__"]
              if not tensor_names:
                  raise SystemExit("model.safetensors contains no tensor entries.")

          if tokenizer.stat().st_size < 1024:
              raise SystemExit("tokenizer.model appears to be incomplete.")

          print(f"Safetensors header parsed; {len(tensor_names)} tensor entries found.")
          print("Both ORBIT files passed the basic validation checks.")
          PY

      - name: Copy the files into the repository
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/orbit-import/model.safetensors" orbit/seed_model/model.safetensors
          cp "$RUNNER_TEMP/orbit-import/tokenizer.model" orbit/seed_model/tokenizer.model

      - name: Commit the binary files to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orbit/seed_model/model.safetensors orbit/seed_model/tokenizer.model
          if git diff --cached --quiet; then
            echo "The model files are already up to date."
            exit 0
          fi
          git commit -m "Add ORBIT Seed model binaries"
          git push origin HEAD:main
