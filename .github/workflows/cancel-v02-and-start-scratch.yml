name: Cancel v0.2 Kaggle session before scratch training

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-v02-and-start-scratch.yml"

permissions:
  contents: read

concurrency:
  group: orbit-v02-cancel-helper
  cancel-in-progress: true

jobs:
  cancel-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}

    steps:
      - name: Install Kaggle client
        run: python -m pip install --upgrade kaggle

      - name: Cancel verified v0.2 Kaggle session
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import inspect
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiCancelKernelSessionRequest

          # Verified from GitHub run 41744997703: Kaggle printed
          # "Kernel version 2 successfully pushed" for the active v0.2 run.
          session_id = 2
          api = KaggleApi()
          api.authenticate()
          signature = inspect.signature(ApiCancelKernelSessionRequest)
          fields = [name for name in signature.parameters if "session" in name.lower()]
          print(f"Installed Kaggle cancel request signature: {signature}")
          if len(fields) != 1:
              raise RuntimeError(f"Cannot identify the session-id field: {fields}")
          request = ApiCancelKernelSessionRequest(**{fields[0]: session_id})
          with api.build_kaggle_client() as client:
              client.kernels.kernels_api_client.cancel_kernel_session(request)
          print(f"Cancellation request accepted by Kaggle for session {session_id}.")
          PY

          KERNEL_ID="dud12345/orbit-seed-v0-2-fine-tuning"
          stopped=0
          for attempt in $(seq 1 30); do
            status="$(kaggle kernels status "$KERNEL_ID" 2>&1 || true)"
            echo "$status"
            if echo "$status" | grep -Eiq 'CANCEL_ACKNOWLEDGED|CANCEL_REQUESTED|COMPLETE|ERROR|CANCELLED|CANCELED'; then
              stopped=1
              break
            fi
            sleep 10
          done
          if (( stopped == 0 )); then
            echo "::error::Kaggle did not confirm that v0.2 stopped."
            exit 1
          fi
          echo "Confirmed that v0.2 Kaggle session is no longer running."
