name: Check ORBIT Kaggle GPU sessions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-v02-and-start-scratch.yml"

permissions:
  contents: read

concurrency:
  group: orbit-kaggle-session-diagnostic
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: \${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: \${{ secrets.KAGGLE_USERNAME }}
    steps:
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Check current v0.2 and v0.3 Kaggle session statuses
        shell: bash
        run: |
          set -euo pipefail
          echo "=== v0.2 pretrained branch ==="
          kaggle kernels status "dud12345/orbit-seed-v0-2-fine-tuning" || true
          echo "=== v0.3 scratch branch ==="
          kaggle kernels status "dud12345/orbit-seed-v0-3-scratch-training" || true
          echo "=== latest v0.2 logs ==="
          kaggle kernels logs "dud12345/orbit-seed-v0-2-fine-tuning" || true
