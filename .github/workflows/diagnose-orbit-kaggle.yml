name: Diagnose ORBIT Kaggle training status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-orbit-kaggle.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Inspect current ORBIT notebooks
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels list --mine --search "ORBIT Seed v0.2" --format json
          echo "=== SFT kernel status ==="
          kaggle kernels status "dud12345/orbit-seed-v0-2-fine-tuning" || true
          echo "=== SFT kernel recent logs ==="
          kaggle kernels logs "dud12345/orbit-seed-v0-2-fine-tuning" || true
