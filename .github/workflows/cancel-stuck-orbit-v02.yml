name: Cancel stale ORBIT v0.2 polling run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stuck-orbit-v02.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the stale run that polled the wrong Kaggle slug
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 41742122558 --repo "$GITHUB_REPOSITORY"
