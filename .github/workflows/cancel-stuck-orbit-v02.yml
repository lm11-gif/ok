name: Cancel stale ORBIT v0.2 runs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stuck-orbit-v02.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale and queued runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run cancel 41742122558 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 41744872568 --repo "$GITHUB_REPOSITORY" || true
