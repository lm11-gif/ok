name: Teacher-supervise ORBIT v0.3 Scratch with DPO

on:
  workflow_run:
    workflows: ["Train ORBIT Seed v0.3 Scratch on Kaggle GPU"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "orbit/seed_model_v0.3_scratch/train_scratch_dpo.py"

permissions:
  contents: write

concurrency:
  group: orbit-v03-scratch-dpo-training
  cancel-in-progress: false

jobs:
  syntax-check:
    if: \${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out ORBIT
        uses: actions/checkout@v4
      - name: Compile scratch DPO script
        run: python -m py_compile orbit/seed_model_v0.3_scratch/train_scratch_dpo.py orbit/seed_model_v0.3_scratch/chat.py

  dpo:
    if: \${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: \${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: \${{ secrets.KAGGLE_USERNAME }}
      GH_TOKEN: \${{ github.token }}

    steps:
      - name: Check out ORBIT
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check scratch DPO script syntax
        run: python -m py_compile orbit/seed_model_v0.3_scratch/train_scratch_dpo.py orbit/seed_model_v0.3_scratch/chat.py

      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade kaggle
          kaggle --version

      - name: Verify the genuine scratch checkpoint is published
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "\${KAGGLE_API_TOKEN:-}" || -z "\${KAGGLE_USERNAME:-}" ]]; then
            echo "::error::Add KAGGLE_API_TOKEN and KAGGLE_USERNAME in repository Actions secrets."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/orbit-v03-scratch-assets"
          gh release download orbit-seed-v0.3-scratch \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "orbit-seed-v0.3-scratch.zip" \
            --dir "$RUNNER_TEMP/orbit-v03-scratch-assets"
          test -s "$RUNNER_TEMP/orbit-v03-scratch-assets/orbit-seed-v0.3-scratch.zip"

      - name: Prepare the Kaggle scratch-DPO kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernel"
          cp orbit/seed_model_v0.3_scratch/train_scratch_dpo.py "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernel/train_scratch_dpo.py"
          cp orbit/seed_model_v0.3_scratch/chat.py "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernel/chat.py"

          kaggle kernels list --mine --search "ORBIT Seed v0.3 Scratch DPO" --format json \
            > "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernels-before.json"
          KERNEL_ID="$(python - "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernels-before.json" <<'PY'
          import json
          import sys
          rows = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [r for r in rows if r.get("title") == "ORBIT Seed v0.3 Scratch DPO"]
          if len(matches) > 1:
              raise SystemExit("Multiple scratch DPO notebooks: " + repr([m.get("ref") for m in matches]))
          if matches:
              print(matches[0]["ref"])
          PY
          )"
          if [[ -z "$KERNEL_ID" ]]; then
            KERNEL_ID="$KAGGLE_USERNAME/orbit-seed-v0-3-scratch-dpo"
          fi
          export KERNEL_ID
          python - "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernel/kernel-metadata.json" <<'PY'
          import json
          import os
          import sys
          metadata = {
              "id": os.environ["KERNEL_ID"],
              "title": "ORBIT Seed v0.3 Scratch DPO",
              "code_file": "train_scratch_dpo.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": "true",
              "enable_gpu": "true",
              "enable_internet": "true",
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": []
          }
          with open(sys.argv[1], "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2)
          PY
          echo "Using Kaggle scratch-DPO notebook ref: $KERNEL_ID"
          cat "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernel/kernel-metadata.json"

      - name: Submit scratch-DPO job
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels push -p "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernel" \
            --timeout 43200 --accelerator NvidiaTeslaT4
          kaggle kernels list --mine --search "ORBIT Seed v0.3 Scratch DPO" --format json \
            > "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernels-after.json"
          KERNEL_ID="$(python - "$RUNNER_TEMP/orbit-v03-scratch-dpo-kernels-after.json" <<'PY'
          import json
          import sys
          rows = json.load(open(sys.argv[1], encoding="utf-8"))
          matches = [r for r in rows if r.get("title") == "ORBIT Seed v0.3 Scratch DPO"]
          if len(matches) != 1:
              raise SystemExit("Expected one scratch DPO notebook; found: " + repr([m.get("ref") for m in matches]))
          print(matches[0]["ref"])
          PY
          )"
          echo "Kaggle confirmed scratch-DPO reference: $KERNEL_ID"
          echo "KERNEL_ID=$KERNEL_ID" >> "$GITHUB_ENV"

      - name: Wait for scratch DPO to finish
        shell: bash
        run: |
          set -euo pipefail
          completed=0
          for attempt in $(seq 1 320); do
            if ! status="$(kaggle kernels status "$KERNEL_ID" 2>&1)"; then
              echo "$status"
              echo "::error::Could not read canonical Kaggle ref '$KERNEL_ID'."
              exit 1
            fi
            echo "$status"
            if echo "$status" | grep -Eiq 'complete|completed|succeeded|finished'; then
              completed=1
              break
            fi
            if echo "$status" | grep -Eiq 'error|failed|cancelled|canceled'; then
              echo "::error::Kaggle reported scratch-DPO failure."
              kaggle kernels logs "$KERNEL_ID" || true
              exit 1
            fi
            sleep 60
          done
          if (( completed == 0 )); then
            echo "::error::Timed out waiting for scratch DPO."
            exit 1
          fi

      - name: Download and validate the scratch-DPO model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/orbit-v03-scratch-dpo-output" "$RUNNER_TEMP/orbit-v03-scratch-dpo-extracted"
          kaggle kernels output "$KERNEL_ID" -p "$RUNNER_TEMP/orbit-v03-scratch-dpo-output" --force
          ARCHIVE="$(find "$RUNNER_TEMP/orbit-v03-scratch-dpo-output" -type f -name 'orbit-seed-v0.3-scratch-dpo.zip' -print -quit)"
          if [[ -z "$ARCHIVE" || ! -s "$ARCHIVE" ]]; then
            echo "::error::Scratch-DPO archive was not found."
            find "$RUNNER_TEMP/orbit-v03-scratch-dpo-output" -maxdepth 4 -type f -printf '%p (%s bytes)\n'
            exit 1
          fi
          python -m zipfile -e "$ARCHIVE" "$RUNNER_TEMP/orbit-v03-scratch-dpo-extracted"
          test -s "$RUNNER_TEMP/orbit-v03-scratch-dpo-extracted/model.safetensors"
          test -s "$RUNNER_TEMP/orbit-v03-scratch-dpo-extracted/tokenizer.model"
          test -s "$RUNNER_TEMP/orbit-v03-scratch-dpo-extracted/dpo_training_report.json"
          echo "ORBIT_SCRATCH_DPO_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "ORBIT_SCRATCH_DPO_EXTRACTED=$RUNNER_TEMP/orbit-v03-scratch-dpo-extracted" >> "$GITHUB_ENV"
          sha256sum "$ARCHIVE"

      - name: Save scratch-DPO report in repository
        shell: bash
        run: |
          set -euo pipefail
          cp "$ORBIT_SCRATCH_DPO_EXTRACTED/dpo_training_report.json" orbit/seed_model_v0.3_scratch/dpo_training_report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orbit/seed_model_v0.3_scratch/dpo_training_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record ORBIT v0.3 scratch DPO results"
            git push origin HEAD:main
          fi

      - name: Publish the scratch-DPO release
        shell: bash
        run: |
          set -euo pipefail
          TAG="orbit-seed-v0.3-scratch-dpo"
          NOTES="$RUNNER_TEMP/orbit-v03-scratch-dpo-notes.md"
          cat > "$NOTES" <<'EOF'
          ORBIT Seed v0.3 Scratch DPO is a preference-tuned derivative of
          ORBIT Seed v0.3 Scratch. The student started from random weights,
          learned from public text and assistant examples, then was adjusted
          with teacher-generated preference pairs. No pretrained teacher
          weights were copied into the student.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ORBIT_SCRATCH_DPO_ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "$TAG" "$ORBIT_SCRATCH_DPO_EXTRACTED/dpo_training_report.json" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ORBIT_SCRATCH_DPO_ARCHIVE" "$ORBIT_SCRATCH_DPO_EXTRACTED/dpo_training_report.json" \
              --repo "$GITHUB_REPOSITORY" \
              --title "ORBIT Seed v0.3 Scratch — DPO teacher-supervised" \
              --notes-file "$NOTES" \
              --target main
          fi

      - name: Publish scratch-DPO summary
        if: always()
        shell: bash
        run: |
          {
            echo "## ORBIT Seed v0.3 Scratch — DPO"
            echo ""
            echo "Kaggle notebook: $KERNEL_ID"
            if [[ -f orbit/seed_model_v0.3_scratch/dpo_training_report.json ]]; then
              echo ""
              cat orbit/seed_model_v0.3_scratch/dpo_training_report.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
